<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script>
    // Tema antes de pintar: el guardado, si no el del sistema; por defecto oscuro
    (function () {
      var t = null;
      try { t = localStorage.getItem("tema"); } catch (e) {}
      if (t !== "claro" && t !== "oscuro") {
        t = window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches ? "claro" : "oscuro";
      }
      document.documentElement.setAttribute("data-tema", t);
    })();
  </script>
  {%- seo -%}
  <link rel="stylesheet" href="{{ "/assets/main.css" | relative_url }}">
  <script src="{{ "/assets/js/portfolio.js" | relative_url }}" defer></script>
  {%- feed_meta -%}
  {%- if jekyll.environment == 'production' and site.google_analytics -%}
    {%- include google-analytics.html -%}
  {%- endif -%}
</head>
