# Categorías del portfolio. Añade aquí cada repo nuevo en su categoría.
# Solo se muestran los repos públicos; los privados o archivados se omiten solos.
# titulo_en/descripcion_en: textos de la versión en inglés (/en/). Las descripciones de
# cada repo en inglés están en _data/descripciones_en.yml.
- titulo: "VFX y shaders"
  descripcion: "Efectos visuales, shaders y sistemas de partículas para Unity URP."
  titulo_en: "VFX and shaders"
  descripcion_en: "Visual effects, shaders and particle systems for Unity URP."
  repos: [Dissolve, Hologram, Water_Underwater, Clouds-Smoke, Explosion-Fire, Blood, Decals, Toon, Outline,
          Wireframe, SDF_Lines, FakeLight, FakeInterior, Fur-Hair, Galaxy, Sun, Boids, Paths, FloatingDust,
          SpeedLines, Stencil_Buffer, BlackAndWhiteArea, BlendMeshTexture, TileStochastic, PlanckScale,
          ObservableUniverse, HUD_Sci-Fi, FootPrints, GhostAvatar, EchoReveal, AnimusFloor, Blueprint,
          Sand, TreeGrowth, Leaves-Petals, Vegetation-Wind, HeatDistortion, SkinnedMesh-VFX,
          RockFall-Breaking, Lava, Insects, Wormhole, Constellation, Egyptian-Gods, VFX-Misc]
- titulo: "Herramientas para Unity"
  descripcion: "Paquetes de editor publicados en npm (UPM)."
  titulo_en: "Unity tools"
  descripcion_en: "Editor packages published on npm (UPM)."
  repos: [UnityFolders, UnityMultiTool, UnityPreset, VAT, DiscoverNotes, PackageCreator]
- titulo: "Demos y proyectos"
